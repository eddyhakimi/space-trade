server {
    listen 80;

    # Re-resolve service names via Docker's embedded DNS so recreated
    # containers (new IPs) are picked up without restarting nginx.
    # proxy_pass with a variable forces runtime resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    set $frontend_upstream http://frontend:5173;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        # WebSocket support for Vite hot reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
