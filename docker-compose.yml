services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/src:/app/src
    expose:
      - "5173"

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
      - gomodcache:/go/pkg/mod
    environment:
      PORT: "8000"
    expose:
      - "8000"

volumes:
  gomodcache:
